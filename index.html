<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DecorVibe — Status</title>
<style>
  :root{
    --plaster:#F6F2EA; --ink:#2E2A24; --ink-soft:#6B6459;
    --line:#DCD3C1; --card:#FFFDF9; --ok:#4E8C5C; --bad:#B4483A;
  }
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; background:var(--plaster); color:var(--ink);
    font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;}
  .wrap{max-width:420px; width:100%;}
  h1{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif; font-size:22px;
    margin:0 0 20px; text-align:center; font-weight:600;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:18px 20px; display:flex; align-items:center; gap:16px; margin-bottom:12px;}
  .icon{width:40px; height:40px; border-radius:50%; display:flex; align-items:center;
    justify-content:center; font-size:20px; flex-shrink:0; color:#fff;}
  .icon.blogger{background:#FF5722;}
  .icon.pinterest{background:#E60023;}
  .icon.facebook{background:#1877F2;}
  .icon.instagram{background:radial-gradient(circle at 30% 110%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);}
  .info{flex:1; min-width:0;}
  .name{font-weight:700; font-size:15px; margin-bottom:2px;}
  .time{font-size:12px; color:var(--ink-soft);}
  .mark{font-size:22px; font-weight:900; flex-shrink:0;}
  .mark.ok{color:var(--ok);}
  .mark.bad{color:var(--bad);}
  #connect{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px;}
  #connect input{width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:7px;
    font-size:14px; margin-bottom:10px; font-family:inherit;}
  #connect button{width:100%; padding:10px; border:none; border-radius:7px; background:#7C4B2C;
    color:#fff; font-weight:700; font-size:14px; cursor:pointer;}
  #connect .note{font-size:11px; color:var(--ink-soft); margin-top:10px; line-height:1.5;}
  #err{color:var(--bad); font-size:12px; margin-top:8px;}
  #loading{text-align:center; color:var(--ink-soft); font-size:13px;}
  .refresh{display:block; text-align:center; margin-top:14px; font-size:12px; color:var(--ink-soft);
    text-decoration:none; cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <h1>DecorVibe — Last Post Status</h1>

  <div id="connect">
    <label style="font-size:12px; font-weight:600; color:var(--ink-soft);">GitHub Token</label>
    <input type="password" id="pat" placeholder="github_pat_...">
    <label style="font-size:12px; font-weight:600; color:var(--ink-soft);">Repo (owner/name)</label>
    <input type="text" id="repo" placeholder="Stockimages/auto-blog">
    <button id="connectBtn">Show Status</button>
    <div id="err"></div>
    <p class="note">Token sirf is browser mein (localStorage) save hota hai, kahin bhejta nahi. Ek baar connect karo, agli baar khud load ho jayega.</p>
  </div>

  <div id="statusPanel" style="display:none;">
    <div class="card">
      <div class="icon blogger">B</div>
      <div class="info">
        <div class="name">Blog (Blogger)</div>
        <div class="time" id="blogger-time">—</div>
      </div>
      <div class="mark" id="blogger-mark">—</div>
    </div>
    <div class="card">
      <div class="icon pinterest">P</div>
      <div class="info">
        <div class="name">Pinterest</div>
        <div class="time" id="pinterest-time">—</div>
      </div>
      <div class="mark" id="pinterest-mark">—</div>
    </div>
    <div class="card">
      <div class="icon facebook">f</div>
      <div class="info">
        <div class="name">Facebook</div>
        <div class="time" id="facebook-time">—</div>
      </div>
      <div class="mark" id="facebook-mark">—</div>
    </div>
    <div class="card">
      <div class="icon instagram">I</div>
      <div class="info">
        <div class="name">Instagram</div>
        <div class="time" id="instagram-time">—</div>
      </div>
      <div class="mark" id="instagram-mark">—</div>
    </div>
    <a class="refresh" id="refreshLink">Refresh</a>
  </div>
</div>

<script>
const API = "https://api.github.com";
let pat = null, repo = null;

function fmt(iso){
  if(!iso) return "No data yet";
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, {month:'short', day:'numeric'}) + ", " +
         d.toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit'});
}

function setPlatform(key, entry){
  const markEl = document.getElementById(key + '-mark');
  const timeEl = document.getElementById(key + '-time');
  if(!entry){
    markEl.textContent = '—';
    markEl.className = 'mark';
    timeEl.textContent = 'No data yet';
    return;
  }
  markEl.textContent = entry.success ? '✓' : '✗';
  markEl.className = 'mark ' + (entry.success ? 'ok' : 'bad');
  timeEl.textContent = fmt(entry.timestamp);
}

async function loadStatus(){
  try{
    const res = await fetch(`${API}/repos/${repo}/contents/status.json`, {
      headers: { 'Authorization': `Bearer ${pat}`, 'Accept': 'application/vnd.github+json' }
    });
    if(!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    const file = await res.json();
    const status = JSON.parse(decodeURIComponent(escape(atob(file.content))));

    document.getElementById('err').textContent = '';
    document.getElementById('connect').style.display = 'none';
    document.getElementById('statusPanel').style.display = 'block';

    setPlatform('blogger', status.blogger);
    setPlatform('pinterest', status.pinterest);
    setPlatform('facebook', status.facebook);
    setPlatform('instagram', status.instagram);
  }catch(err){
    document.getElementById('err').textContent = 'Could not load status: ' + err.message;
  }
}

document.getElementById('connectBtn').addEventListener('click', () => {
  pat = document.getElementById('pat').value.trim();
  repo = document.getElementById('repo').value.trim();
  if(!pat || !repo){ document.getElementById('err').textContent = 'Token aur repo dono chahiye.'; return; }
  localStorage.setItem('decorStatusPat', pat);
  localStorage.setItem('decorStatusRepo', repo);
  loadStatus();
});

document.getElementById('refreshLink').addEventListener('click', loadStatus);

window.addEventListener('load', () => {
  const savedPat = localStorage.getItem('decorStatusPat');
  const savedRepo = localStorage.getItem('decorStatusRepo');
  if(savedPat && savedRepo){
    document.getElementById('pat').value = savedPat;
    document.getElementById('repo').value = savedRepo;
    pat = savedPat; repo = savedRepo;
    loadStatus();
  }
});
</script>
</body>
</html>
